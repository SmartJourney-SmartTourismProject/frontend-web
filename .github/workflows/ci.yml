name: CI

on:
  push:
    branches: [main, new-main]
  pull_request:
  workflow_dispatch:

# Unit-only: no NestJS/FastAPI/Keycloak backing services and no .env secrets
# needed for lint + Vitest/RTL. Playwright's e2e/journey.spec.ts needs the
# full local stack (RUNNING.md) and is intentionally not run here - see
# Documentation/Testing/MASTER_TEST_PLAN.md.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # ---- CD: production deploys come from here, not from Vercel's own Git
  # integration (vercel.json turns that off for new-main), so a commit that
  # fails lint or tests never reaches production. Pull-request previews are
  # still built by Vercel. new-main is this repo's default branch.
  deploy:
    if: github.ref == 'refs/heads/new-main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: production-frontend
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Until the Vercel secrets are added (deploy/MANUAL_SETUP.md) this job
      # skips cleanly instead of failing the pipeline.
      - name: Check deploy secrets
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Deploy skipped: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Pull Vercel settings and env vars
        if: steps.gate.outputs.enabled == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      # A variable saved in Vercel with an EMPTY value (NEXTAUTH_URL="" ...)
      # reaches the build as an empty string, which `new URL('')` and next-auth
      # reject, failing prerendering. An unset variable is fine, so drop empty ones.
      - name: Drop empty variables
        if: steps.gate.outputs.enabled == 'true'
        run: |
          if [ -f .vercel/.env.production.local ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=("")?$' .vercel/.env.production.local | sed 's/=.*//' | sed 's/^/::warning::Ignoring empty Vercel variable: /' || true
            sed -i -E '/^[A-Za-z_][A-Za-z0-9_]*=(\"\")?$/d' .vercel/.env.production.local
          fi
      # `vercel build` outside Vercel leaves VERCEL_URL empty, and next-auth/react
      # does new URL(NEXTAUTH_URL ?? VERCEL_URL) when the pages are imported - so
      # with NEXTAUTH_URL unset the prerender dies with "Invalid URL". Give the
      # build the production URL (the same value the app uses at runtime).
      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        env:
          NEXTAUTH_URL: https://aismartjourney.vercel.app
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to production
        if: steps.gate.outputs.enabled == 'true'
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
